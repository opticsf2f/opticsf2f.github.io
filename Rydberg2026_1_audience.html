size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eRydberg scaling\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/Rydberg_2.png\u0027 alt=\u0027image ./RFigures/Rydberg_2.png\u0027 class=\u0027simage\u0027 style=\u0027height:480px;max-height:480px;\u0027\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eHighly-excited Rydberg atoms\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eRydberg atom ($n=52$)  \u003c/p\u003e\u003cimg src=\u0027./RFigures/RydbergWavefunction.png\u0027 alt=\u0027image ./RFigures/RydbergWavefunction.png\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003e500 nm across\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eVirus  \u003c/p\u003e\u003cimg src=\u0027./RFigures/Virus.png\u0027 alt=\u0027image ./RFigures/Virus.png\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003e$\u0026lt;100$ nm\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eRydberg wavefunctions and $n$ scaling\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003ciframe src=\u0027./RFigures/rydberg_wavefunctions.html\u0027 title=\u0027iframe ./RFigures/rydberg_wavefunctions.html\u0027 class=\u0027sframe\u0027 style=\u0027height:1600px;max-height:1600px;\u0027\u003e\u003c/iframe\u003e\u003cp\u003e\u003cem\u003eRydberg physics\u003c/em\u003e, N Sibalic and CSA, IOP Publishing (2018)\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eAlkali atoms energy levels\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eCs atom $n\\ell$ states\u003c/p\u003e\u003cimg src=\u0027./RFigures/Atomic_Levels_0.png\u0027 alt=\u0027image ./RFigures/Atomic_Levels_0.png\u0027 class=\u0027simage\u0027 style=\u0027height:480px;max-height:480px;\u0027\u003e\u003cp\u003eD2 line (red)\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eRydberg tunability\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:0.80em\u0027\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003ePrincipal quantum number $n$ is a tuning parameter!\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eTransition frequencies: 6 orders of magnitude of EM spectrum.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eLarge dipole moments.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eEspecially in microwave/THz: Sensing!\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eLarge dipoles: Strong interactions.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eElectric dipole allowed transitions\u003c/p\u003e\u003cimg src=\u0027./RFigures/All_Cs_Transitions_l.png\u0027 alt=\u0027image ./RFigures/All_Cs_Transitions_l.png\u0027 class=\u0027simage\u0027 style=\u0027height:720px;max-height:720px;\u0027\u003e\u003cp\u003eLucy Downes, Durham.\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eLarge dipoles $\\rightarrow$ strong interactions\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:0.80em\u0027\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003ePair states $n$s,$n$s $\\rightarrow$ $n$p$n\u0027$p\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\cal H}_{\\rm dd} \u0026amp; = \u0026amp; \n\\left(\\begin{array}{cc} \n0 \u0026amp; V\\\\\nV \u0026amp; \\Delta\n\\end{array}\n\\right)\u003cbr /\u003e\n\\end{eqnarray}     \u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\\begin{eqnarray} V \u0026amp; = \u0026amp; \\frac{d^2}{4\\pi\\epsilon_0R^3}  \\end{eqnarray}\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eEnergy defect $\\Delta$ scales as $1/n^3$\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eShift scales as $V^2/\\Delta$ proportional to $n^{11}$.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eShift scales as $1/R^6$ (van der Waals).\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:0.80em\u0027\u003e\u003cp\u003e60S-60S for Rb\u003c/p\u003e\u003cimg src=\u0027./RFigures/ARCInteractions.jpg\u0027 alt=\u0027image ./RFigures/ARCInteractions.jpg\u0027 class=\u0027simage\u0027 style=\u0027height:480px;max-height:480px;\u0027\u003e\u003cp\u003eVan der Waals shift of $\\vert rr\\rangle$ \u003c/p\u003e\n\u003cp\u003eat a few microns of order GHz.\u003c/p\u003e\n\u003cp\u003eLaser excitation linewidth of order MHz.\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eRydberg interaction complexity\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/ARC.png\u0027 alt=\u0027image ./RFigures/ARC.png\u0027 class=\u0027simage\u0027 style=\u0027height:240px;max-height:240px;\u0027\u003e\u00
