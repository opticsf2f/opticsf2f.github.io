le": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eOAM THz beams\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/THZ_OAM.png\u0027 alt=\u0027image ./RFigures/THZ_OAM.png\u0027 class=\u0027simage\u0027 style=\u0027height:240px;max-height:240px;\u0027\u003e\u003cp\u003e\u003cem\u003eRapid readout of terahertz orbital angular momentum beams using atom-based imaging\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eLA Downes, DJ Whiting, CSA, KJ Weatherill,\u003c/p\u003e\n\u003cp\u003eOpt. Lett \u003cstrong\u003e47\u003c/strong\u003e, 6001 (2022)\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cp\u003eWhat happens if we add a THz polarizer?\u003c/p\u003e\u003cimg src=\u0027./RFigures/THzPolarizer.png\u0027 alt=\u0027image ./RFigures/THzPolarizer.png\u0027 class=\u0027simage\u0027 style=\u0027height:200px;max-height:200px;\u0027\u003e\u003cp\u003eMeasure vector components of OAM beams\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eTerahertz imaging experiment\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eLG$_{01}$ mode, ${\\cal E}_y$ at the focus.\u003c/p\u003e\u003cimg src=\u0027./RFigures/Matt1.png\u0027 alt=\u0027image ./RFigures/Matt1.png\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003eMatt Jamieson, to appear\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003e\u0027\u0027It\u0027s just optics!\u0027\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Opticsf2f.jpg\u0027 alt=\u0027image ./RFigures/Opticsf2f.jpg\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003e\u003ca href=\"https://opticsf2f.github.io/\"\u003ehttps://opticsf2f.github.io/\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eIt\u0027s just optics!\u0027\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/VectorHedgehog.png\u0027 alt=\u0027image ./RFigures/VectorHedgehog.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003cp\u003eVector Hedgehog\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eVector hedgehog\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027gridslide\u0027 style=\u0027grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 50.00%)\u0027\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 1 / 2; font-size:0.50em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003e\\begin{eqnarray}\n    \\boldsymbol{{\\cal E}}(x,y,z) \u0026amp;= \u0026amp; [{\\cal E}_x(x,y,z) \\hat{\\boldsymbol{x}} \n    +\n    {\\cal E}_y(x,y,z) \\hat{\\boldsymbol{y}}\n    +\n    {\\cal E}_z(x,y,z) \\hat{\\boldsymbol{z}}\n    ] {\\rm e}^{{\\rm i} (k_z z-\\omega t)}\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003eFrom $ \\boldsymbol{\\nabla} \\cdot  \\boldsymbol{{\\cal E}}  =  0 $\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n\\frac{\\partial {\\cal E}_x}{\\partial x }\n+\n\\frac{\\partial {\\cal E}_y}{\\partial y }\n+\n\\frac{\\partial {\\cal E}_z}{\\partial z }\n+ {\\rm i}k {\\cal E}_z \u0026amp; = \u0026amp; 0\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003e$x$ polarization: ${\\cal E}_x\\gg {\\cal E}_y$  and paraxial (propagate along $z$) $\\partial {\\cal E}_z/\\partial z \\ll k {\\cal E}_z$\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n\\bbox[5px, border: 2px solid red]{\n{\\cal E}_z  =  \\frac{{\\rm i}}{ k_z }\\frac{\\partial {\\cal E}_x}{\\partial x }\n}\n\\end{eqnarray}\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eFor $ {\\cal E}_y $ start from Ampere-Maxwell\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\rm i}k_z\\boldsymbol{\\hat{z}} \\times \\boldsymbol{{\\cal B}}\n+\\boldsymbol{\\nabla} \\times \\boldsymbol{{\\cal B}}  \u0026amp; = \u0026amp; - {\\rm i}\\frac{k_z}{ c }\\boldsymbol{{\\cal E}}\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\cal E}_y \u0026amp; = \u0026amp; c\\left[\n-{\\cal B}_x + \\frac{{\\rm i}}{ k_z }\\left(\n\\frac{\\partial {\\cal B}_x}{\\partial z }-\n\\frac{\\partial {\\cal B}_z}{\\partial x }\\right)\n\\right]\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003e$\\partial {\\cal B}_x/\\partial z\\ll\\partial {\\cal B}_z/\\partial x$, and neglect $\\partial {\\cal B}_x/\\partial z$ term. As $c{\\cal B}_x \\approx {\\cal E}_y$, we end up with \u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n2{\\cal E}_y = -{\\rm i}\\frac{c}{k_z}\\frac{\\partial {\\cal B}_z}{\\partial x} \n\\end{eqnarray}\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 1 / 2; font-size:0.50em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eFrom $ \\boldsymbol{\\nabla} \\cdot  \\boldsymbol{{\\cal B}}  =  0 $\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\cal B}_z \u0026amp; = \u0026amp; \\frac{{\\rm i}}{ k_z }\\frac{\\partial {\\cal B}_y}{\\partial y } = \\frac{{\\rm i}}{ ck_z }\\frac{\\partial {\\cal E}_x}{\\partial y }\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003eand hence\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n\\bbox[5px, border: 2px solid red]{\n{\\cal E}_y  =  \\frac{1}{2 k_z^2 }\\frac{\\partial^2 {\\cal E}_x}{\\partial x \\partial y}\n}\n\\end{eqnarray}\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003eStarting from $ {\\cal E}^{(0)}_x $ only \u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\cal E}^{(z)}_{x} \u0026amp;=\u0026amp;{\\cal F}^{-1}\\left[ {\\rm e}^{{\\rm i}k_z z}\n\\left(\n{\\cal F}\\left[  {\\cal E}^{(0)}_x \\right] \n\\right)\n\\right]\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\cal E}^{(z)}_{y} \u0026amp;=\u0026amp; -{\\cal F}^{-1}\\left[ {\\rm e}^{{\\rm i}k_z z}\n\\left(  \\frac{k_xk_y}{2k_z^2} {\\cal F}\\left[  {\\cal E}^{(0)}_x \\right]\n\\right)\n\\right]\n\\end{eqnarray}\u003c/p\u003e\n\u003cp\u003e\\begin{eqnarray}\n{\\cal E}^{(z)}_{z} \u0026amp;=\u0026amp; - {\\cal F}^{-1}\\left[ {\\rm e}^{{\\rm i}k_z z}\n\\left(\n  \\frac{k_x}{k_z} {\\cal F}\\left[  {\\cal E}^{(0)}_x \\right]\n\\right)\n\\right]\n\\end{eqnarray}\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eVector hedgehog solution for LG$_{01}$\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003e${\\cal E}_x$, ${\\cal E}_y$ and  ${\\cal E}_z$ everywhere\u003c/p\u003e\u003cimg src=\u0027./RFigures/vector_lg1.png\u0027 alt=\u0027image ./RFigures/vector_lg1.png\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003eOptics f2f, 2\u003csup\u003end\u003c/sup\u003e edition!\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eTerahertz imaging experiment\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Matt2.png\u0027 alt=\u0027image ./RFigures/Matt2.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003cp\u003eMatt Jamieson et al, to appear\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eTerahertz imaging experiment\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Matt3.png\u0027 alt=\u0027image ./RFigures/Matt3.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003cp\u003eMatt Jamieson et al, to appear\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003ePartII: Rydberg qudits for sensing and \u003cem\u003ecomputation\u003c/em\u003e \u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eWhy did we get interested in qudits?\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eWhat kind of experiments have we done?\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eWhat might we be able to do? The graph colouring problem.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eRydberg diversity: So many states!\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027gridslide\u0027 style=\u0027grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 25.00%)\u0027\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 1 / 2; font-size:1.00em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cul\u003e\n\u003cli\u003eCs energy levels \u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 2 / 3; font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/Atomic_Levels_0.png\u0027 alt=\u0027image ./RFigures/Atomic_Levels_0.png\u0027 class=\u0027simage\u0027 style=\u0027height:480px;max-height:480px;\u0027\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 1 / 2; font-size:1.00em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cul\u003e\n\u003cli\u003eAllowed transitions \u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/All_Cs_Transitions_l.png\u0027 alt=\u0027image ./RFigures/All_Cs_Transitions_l.png\u0027 class=\u0027simage\u0027 style=\u0027height:480px;max-height:480px;\u0027\u003e\u003cp\u003eLucy Downes, Durham.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003eRydberg photonic qutrits: Jiao \u003cem\u003eet al\u003c/em\u003e, arXiv:2412.03060 \u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027gridslide\u0027 style=\u0027grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 50.00%)\u0027\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 1 / 2; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Qutrit1.png\u0027 alt=\u0027image ./RFigures/Qutrit1.png\u0027 class=\u0027simage\u0027 style=\u0027height:280px;max-height:280px;\u0027\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 1 / 2; font-size:1.00em\u0027\u003e\u003cdiv class=\u0027span\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003e1 channel, 4 states (g $+$ 3 r)\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Qutrit2.png\u0027 alt=\u0027image ./RFigures/Qutrit2.png\u0027 class=\u0027simage\u0027 style=\u0027height:280px;max-height:280px;\u0027\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Qutrit3.png\u0027 alt=\u0027image ./RFigures/Qutrit3.png\u0027 class=\u0027simage\u0027 style=\u0027height:280px;max-height:280px;\u0027\u003e\u003c/div\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eWhy stop at 3?\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eWhy stop at 3? Rydberg sensor with 8 Rydberg states\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/GianlucaPaper.png\u0027 alt=\u0027image ./RFigures/GianlucaPaper.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eRydberg qudit with $d=9$ states: g $+$ 8 r\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/GianlucaExpt.png\u0027 alt=\u0027image ./RFigures/GianlucaExpt.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eRydberg Qudits\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cul\u003e\n\u003cli\u003eWhat can we do with $d$ states and $N$ atoms?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e$N$ spatial channels in a photon/polariton expt.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eHilbert space dimension $d^N$: 4 states, 10 channels/atoms \u0026gt; 1 million!\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eHilbert space dimension $d^N$: 9 states, 4 channels/atoms \u0026gt; 6 million!\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eOptimisation problems? Non-abelian gauge theories: arXiv:2203.11541 (many g + 1 r)\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eGraph colouring using Rydberg qudits\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/ToonPaper1.png\u0027 alt=\u0027image ./RFigures/ToonPaper1.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003cp\u003eAngkhanawin, Deger, Pritchard and Adams, arXiv:2504.08598\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eGraph colouring\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/Petersen_graph.png\u0027 alt=\u0027image ./RFigures/Petersen_graph.png\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003eA proper m-coloring of an undirected graph G is an assignment of one of m possible\ncolors to each vertex of G such that no two adjacent vertices share the same color.\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eGraph colouring\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/Sudoku.png\u0027 alt=\u0027image ./RFigures/Sudoku.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003cp\u003eAragon Artacho and Campoy, Set-Valued Var. Anal. \u003cstrong\u003e26\u003c/strong\u003e, 277 (2018).\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eGraph colouring\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/Sudoku1.png\u0027 alt=\u0027image ./RFigures/Sudoku1.png\u0027 class=\u0027simage\u0027 style=\u0027height:600px;max-height:600px;\u0027\u003e\u003cp\u003eAragon Artacho and Campoy, Set-Valued Var. Anal. \u003cstrong\u003e26\u003c/strong\u003e, 277 (2018).\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003eRydberg Quantum annealing: Bernien \u003cem\u003eet al\u003c/em\u003e, Nature \u003cstrong\u003e551\u003c/strong\u003e, 579 (2017) \u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027gridslide\u0027 style=\u0027grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 50.00%)\u0027\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 1 / 2; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Bernien0.png\u0027 alt=\u0027image ./RFigures/Bernien0.png\u0027 class=\u0027simage\u0027 style=\u0027height:280px;max-height:280px;\u0027\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 1 / 2; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Bernien1.png\u0027 alt=\u0027image ./RFigures/Bernien1.png\u0027 class=\u0027simage\u0027 style=\u0027height:280px;max-height:280px;\u0027\u003e\u003c/div\u003e\u003cdiv style=\u0027padding:0.3em;grid-column: 2 / 3; grid-row: 2 / 3; font-size:0.50em\u0027\u003e\u003cimg src=\u0027./RFigures/Bernien2.png\u0027 alt=\u0027image ./RFigures/Bernien2.png\u0027 class=\u0027simage\u0027 style=\u0027height:280px;max-height:280px;\u0027\u003e\u003c/div\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eRydberg Qudit quantum annealer\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eCan we solve any Sodoku problem in 1 microsecond?\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eAre ground states (non-interacting) useful?\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eWhat is the effect of inter-Rydberg interactions?\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eWhat about NNN interactions?\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eQudit Hamiltonian\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:0.80em\u0027\u003e\u003cp\u003e\\begin{equation}\nH_{\\rm Ryd} = \\sum_{v~{\\rm in}~{\\sf V(G)}}\\sum_{i}(\\frac{\\Omega_i}{2}\\sigma^{(v)}_i - \\Delta_i n^{(v)}_i )\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n+ \\sum_{(u,v)~{\\rm in}~{\\sf E(G)}}\\sum_{i} V^{(i)}\n(|\\boldsymbol{r}_u - \\boldsymbol{r}_v|) n^{(u)}_i n^{(v)}_i\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n+ \\sum_{(u,v)~{\\rm in}~{\\sf E(G)}}\\sum_{i\u0026lt;j} V^{(ij)}(|\\boldsymbol{r}_u - \\boldsymbol{r}_v|) (n^{(u)}_i n^{(v)}_j +n^{(u)}_j n^{(v)}_i)\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n\\end{equation}\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e${\\sf V(G)}$ is the set of vertices $\\equiv$ atoms\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e${\\sf E(G)}$ is the set of edges $\\equiv$ interactions\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eQudit Hamiltonian\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:0.80em\u0027\u003e\u003cp\u003e\\begin{equation}\nH_{\\rm Ryd} = \\sum_{v~{\\rm in}~{\\sf V(G)}}\\sum_{i}(\\frac{\\Omega_i}{2}\\sigma^{(v)}_i - \\Delta_i n^{(v)}_i )\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n+ \\sum_{(u,v)~{\\rm in}~{\\sf E(G)}}\\sum_{i} V^{(i)}\n(|\\boldsymbol{r}_u - \\boldsymbol{r}_v|) n^{(u)}_i n^{(v)}_i\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n+ \\sum_{(u,v)~{\\rm in}~{\\sf E(G)}}\\sum_{i\u0026lt;j} V^{(ij)}(|\\boldsymbol{r}_u - \\boldsymbol{r}_v|) (n^{(u)}_i n^{(v)}_j +n^{(u)}_j n^{(v)}_i)\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n\\end{equation}\u003c/p\u003e\n\u003cp\u003e\\begin{equation}\n~\n\\end{equation}\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:0.50em\u0027\u003e\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e${\\sf V(G)}$ is the set of vertices $\\equiv$ atoms\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e${\\sf E(G)}$ is the set of edges $\\equiv$ interactions\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRedundant information: NNN plus inter-colour/state $V^{(ij)}$ interactions \u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eNN $V^{(i)}=1$, $V^{(ij)}=0$ Potts model. $2$-colour, $2$-states (Ising)\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cem\u003eRydberg  interacions\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027left\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/ARC.png\u0027 alt=\u0027image ./RFigures/ARC.png\u0027 class=\u0027simage\u0027 style=\u0027height:240px;max-height:240px;\u0027\u003e\u003c/div\u003e\u003cdiv class=\u0027right\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cp\u003e60S pair state in Rb\u003c/p\u003e\u003cimg src=\u0027./RFigures/ARCInteractions.jpg\u0027 alt=\u0027image ./RFigures/ARCInteractions.jpg\u0027 class=\u0027simage\u0027 style=\u0027height:400px;max-height:400px;\u0027\u003e\u003cp\u003esee also PairInteraction\u003c/p\u003e\u003c/div\u003e", "style": ""}, {"canvas": "", "html": "\u003cdiv class=\u0027title\u0027 style=\u0027font-size:1.25em\u0027\u003e\u003cp\u003e\u003cstrong\u003eNew code added to ARC\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0027spancenter\u0027 style=\u0027font-size:1.00em\u0027\u003e\u003cimg src=\u0027./RFigures/KarenInteractionMap.png\u0027 alt=\u0027image ./RFigures/Kar
